<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACA French Listening Scripts</title>
<style>
:root{--primary:#2563eb;--primary-light:#dbeafe;--accent:#f59e0b;--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:white;padding:24px;text-align:center}
.header h1{margin:0 0 6px;font-size:22px}
.header p{margin:0;opacity:.9;font-size:14px}
.week-tabs{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.week-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:white;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
.week-tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.week-tab:hover:not(.active){background:var(--primary-light);color:var(--primary)}
.content{max-width:720px;margin:0 auto;padding:20px 16px 100px}
.scene-box{background:#fef3c7;border-left:4px solid var(--accent);padding:14px 16px;border-radius:8px;margin-bottom:20px;font-size:14px;line-height:1.6}
.scene-box strong{color:#92400e}
.dialogue-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.speaker{min-width:100px;font-weight:700;color:var(--primary);font-size:13px;text-transform:uppercase;letter-spacing:.3px;padding-top:10px}
.bubble{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;position:relative;cursor:pointer;transition:all .2s}
.bubble:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(37,99,235,.08)}
.bubble.playing{border-color:var(--primary);background:var(--primary-light)}
.bubble .french{font-size:15px;line-height:1.6;margin-bottom:4px}
.bubble .english{font-size:12px;color:var(--muted);font-style:italic;line-height:1.5}
.play-icon{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0;transition:opacity .2s}
.bubble:hover .play-icon,.bubble.playing .play-icon{opacity:1}
.play-icon svg{width:12px;height:12px;fill:currentColor}
.controls-bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;background:white;border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:20;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border);background:white;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .2s}
.btn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}
.btn.primary:hover{background:#1d4ed8}
.speed-select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);font-size:13px;background:white}
.questions{margin-top:24px;padding:16px;background:white;border-radius:12px;border:1px solid var(--border)}
.questions h3{margin:0 0 12px;font-size:15px;color:var(--primary)}
.q-item{padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.q-item:last-child{border-bottom:none}
.hidden{display:none}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-60px);background:#1e293b;color:white;padding:10px 20px;border-radius:8px;font-size:13px;z-index:100;transition:transform .3s ease}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="header"><h1>🎧 ACA French Listening Scripts</h1><p>Click any line to hear French audio — works offline</p></div>
<div class="week-tabs" id="weekTabs"></div>
<div class="content" id="content"></div>
<div class="controls-bar">
  <button class="btn" onclick="playAll()">▶ Play All</button>
  <button class="btn" onclick="stopAll()">⏹ Stop</button>
  <label style="font-size:13px;color:var(--muted)">Speed:</label>
  <select class="speed-select" id="speed" onchange="updateSpeed()">
    <option value="0.7">0.7x Slow</option><option value="0.85">0.85x</option>
    <option value="1" selected>1x Normal</option><option value="1.15">1.15x</option>
  </select>
  <button class="btn primary" onclick="toggleQuestions()">📝 Questions</button>
</div>
<div class="toast" id="toast"></div>
<script>
const data=[{week:1,title:"Bienvenue au centre !",scene:"The reception desk of the ACA training centre in the morning. A coordinator welcomes two new learners. Posters of Paris and Kinshasa on the wall.",lines:[{speaker:"Coordinatrice",fr:"Bonjour et bienvenue au centre ACA ! Comment vous appelez-vous ?",en:"Good morning and welcome to the ACA centre! What is your name?"},{speaker:"Patrick",fr:"Bonjour Madame. Je m'appelle Patrick Mbuyi.",en:"Good morning, Madam. My name is Patrick Mbuyi."},{speaker:"Coordinatrice",fr:"Enchantée, Patrick. Vous êtes de quelle ville ?",en:"Nice to meet you, Patrick. Which city are you from?"},{speaker:"Patrick",fr:"Je suis de Lubumbashi. Et voici ma sœur, Sarah.",en:"I am from Lubumbashi. And here is my sister, Sarah."},{speaker:"Sarah",fr:"Bonjour Madame, je suis étudiante en informatique.",en:"Hello Madam, I am a computer science student."},{speaker:"Coordinatrice",fr:"Très bien ! Vous êtes frère et sœur — vous êtes tous les deux de Lubumbashi ?",en:"Very good! You are brother and sister — are you both from Lubumbashi?"},{speaker:"Sarah",fr:"Oui, nous sommes de Lubumbashi, mais notre famille est de Kisangani.",en:"Yes, we are from Lubumbashi, but our family is from Kisangani."},{speaker:"Coordinatrice",fr:"Parfait. Le cours est à neuf heures dans la salle 2. À bientôt !",en:"Perfect. The class is at nine o'clock in room 2. See you soon!"},{speaker:"Patrick",fr:"Merci beaucoup, Madame. À bientôt !",en:"Thank you very much, Madam. See you soon!"}],questions:["1. What is the man's name? (Patrick Ilunga / Patrick Mbuyi / Paul Mbuyi)","2. Where are Patrick and Sarah from? (Kinshasa / Kisangani / Lubumbashi)","3. What does Sarah study? (Medicine / Computer science / Law)","4. Where is their family from? (Kisangani / Goma / Bukavu)","5. At what time is the class? (8 o'clock / 9 o'clock / 10 o'clock)"]},{week:2,title:"Le formulaire",scene:"A young man filling in a library registration form in Kinshasa. The librarian asks questions; close-ups of the form fields.",lines:[{speaker:"Bibliothécaire",fr:"Bonjour Monsieur, bienvenue à la bibliothèque. Votre nom, s'il vous plaît ?",en:"Hello Sir, welcome to the library. Your name, please?"},{speaker:"Jonathan",fr:"Je m'appelle Jonathan Kasongo.",en:"My name is Jonathan Kasongo."},{speaker:"Bibliothécaire",fr:"Kasongo… Vous pouvez épeler ?",en:"Kasongo… Can you spell that?"},{speaker:"Jonathan",fr:"K-A-S-O-N-G-O.",en:"K-A-S-O-N-G-O."},{speaker:"Bibliothécaire",fr:"Merci. Quel âge avez-vous ?",en:"Thank you. How old are you?"},{speaker:"Jonathan",fr:"J'ai vingt-deux ans.",en:"I am twenty-two years old."},{speaker:"Bibliothécaire",fr:"Vous êtes étudiant ?",en:"Are you a student?"},{speaker:"Jonathan",fr:"Oui, je suis étudiant à l'Université de Kinshasa.",en:"Yes, I am a student at the University of Kinshasa."},{speaker:"Bibliothécaire",fr:"Très bien. Et votre numéro de téléphone ?",en:"Very good. And your telephone number?"},{speaker:"Jonathan",fr:"Zéro huit, quinze, vingt-trois, quarante.",en:"08 15 23 40."},{speaker:"Bibliothécaire",fr:"Parfait, voici votre carte. Bienvenue !",en:"Perfect, here is your card. Welcome!"}],questions:["1. What is the man's family name? (Kasanda / Kasongo / Kabongo)","2. How old is he? (20 / 21 / 22)","3. Where does he study? (University of Kinshasa / University of Goma / He does not study)","4. What is the first pair of digits in his phone number? (09 / 08 / 07)","5. What does he receive at the end? (A book / A library card / A form)"]},{week:3,title:"La journée de Maman Rose",scene:"A mini-documentary following Rose, a market seller in Bukavu, from morning to night. Voice-over in slow, clear French with close-ups of daily activities.",lines:[{speaker:"Narrateur",fr:"Voici Rose. Elle est vendeuse au grand marché de Bukavu.",en:"Here is Rose. She is a seller at the big market in Bukavu."},{speaker:"Narrateur",fr:"Chaque jour, elle se réveille à cinq heures du matin.",en:"Every day, she wakes up at five in the morning."},{speaker:"Rose",fr:"Je me lève, je me lave et je prends le petit-déjeuner avec mes enfants.",en:"I get up, I wash and I have breakfast with my children."},{speaker:"Narrateur",fr:"À six heures et demie, elle va au marché à pied.",en:"At half past six, she goes to the market on foot."},{speaker:"Rose",fr:"J'ai une petite boutique. Je vends des légumes et des fruits.",en:"I have a small shop. I sell vegetables and fruit."},{speaker:"Narrateur",fr:"À midi, Rose déjeune au marché avec ses amies.",en:"At noon, Rose has lunch at the market with her friends."},{speaker:"Rose",fr:"L'après-midi, je travaille encore. Je rentre à la maison à six heures du soir.",en:"In the afternoon, I work again. I go back home at six in the evening."},{speaker:"Narrateur",fr:"Le soir, Rose dîne avec sa famille et elle écoute la radio.",en:"In the evening, Rose has dinner with her family and listens to the radio."},{speaker:"Rose",fr:"Je me couche à neuf heures. Demain est un nouveau jour !",en:"I go to bed at nine. Tomorrow is a new day!"}],questions:["1. What is Rose's job? (Teacher / Market seller / Nurse)","2. What time does she wake up? (5 a.m. / 6 a.m. / 7 a.m.)","3. How does she go to the market? (By motorbike / By bus / On foot)","4. What does she sell? (Clothes / Vegetables and fruit / Bread)","5. What does she do in the evening? (Watches TV / Listens to the radio / Studies French)"]},{week:4,title:"Au restaurant « Chez Maman Furaha »",scene:"A short comedy video in a small restaurant in Goma. A waiter with a notepad takes an order from two hungry customers. Plates of food arrive at the end.",lines:[{speaker:"Serveur",fr:"Bonsoir ! Vous êtes deux ? Voici le menu.",en:"Good evening! Table for two? Here is the menu."},{speaker:"Claude",fr:"Bonsoir ! Qu'est-ce que vous avez comme poisson ?",en:"Good evening! What fish do you have?"},{speaker:"Serveur",fr:"Nous avons du capitaine et du tilapia, très frais.",en:"We have Nile perch and tilapia, very fresh."},{speaker:"Claude",fr:"Parfait. Je voudrais du tilapia avec du riz, s'il vous plaît.",en:"Perfect. I would like tilapia with rice, please."},{speaker:"Serveur",fr:"Et pour vous, Madame ?",en:"And for you, Madam?"},{speaker:"Mireille",fr:"Pour moi, du poulet avec des légumes et une banane plantain.",en:"For me, chicken with vegetables and a plantain banana."},{speaker:"Serveur",fr:"Très bien. Et comme boisson ?",en:"Very good. And to drink?"},{speaker:"Mireille",fr:"De l'eau, s'il vous plaît.",en:"Some water, please."},{speaker:"Claude",fr:"Pour moi, un café après le repas.",en:"A coffee after the meal for me."},{speaker:"Serveur",fr:"C'est noté ! J'arrive dans dix minutes.",en:"Noted! I'll be back in ten minutes."}],questions:["1. Which two fish does the restaurant have? (Capitaine and tilapia / Sardine and thon / Tilapia and sardine)","2. What does Claude order? (Chicken with rice / Tilapia with rice / Capitaine with plantain)","3. What does Mireille order to drink? (Coffee / Tea / Water)","4. When does Claude want his coffee? (Before the meal / With the meal / After the meal)","5. How long will the food take? (5 minutes / 10 minutes / 20 minutes)"]},{week:5,title:"Le taxi-moto",scene:"A young woman stops a taxi-moto in Bukavu and explains where she wants to go. Street sounds, a short ride, arrival at the hospital.",lines:[{speaker:"Chauffeur",fr:"Bonjour Mademoiselle ! Vous allez où ?",en:"Hello Miss! Where are you going?"},{speaker:"Espérance",fr:"Bonjour ! Pour aller à l'hôpital général, s'il vous plaît.",en:"Hello! To the general hospital, please."},{speaker:"Chauffeur",fr:"L'hôpital général ? C'est près de la cathédrale, non ?",en:"The general hospital? That's near the cathedral, right?"},{speaker:"Espérance",fr:"Oui, c'est en face de la cathédrale, à côté de la pharmacie.",en:"Yes, it's opposite the cathedral, next to the pharmacy."},{speaker:"Chauffeur",fr:"D'accord. C'est loin — trois mille francs.",en:"OK. It's far — three thousand francs."},{speaker:"Espérance",fr:"Trois mille ? C'est cher ! Deux mille ?",en:"Three thousand? That's expensive! Two thousand?"},{speaker:"Chauffeur",fr:"D'accord, deux mille cinq cents. Montez !",en:"OK, two thousand five hundred. Get on!"},{speaker:"Espérance",fr:"Au carrefour, tournez à gauche, puis allez tout droit.",en:"At the crossroads, turn left, then go straight."},{speaker:"Chauffeur",fr:"Voilà, nous sommes arrivés. L'hôpital est juste devant.",en:"Here we are. The hospital is right in front."},{speaker:"Espérance",fr:"Merci beaucoup ! Bonne journée !",en:"Thank you very much! Have a good day!"}],questions:["1. Where does Espérance want to go? (To the cathedral / To the pharmacy / To the general hospital)","2. The hospital is… (opposite the cathedral / next to the cathedral / behind the cathedral)","3. What is the first price the driver asks? (2,000 francs / 3,000 francs / 2,500 francs)","4. What price do they finally agree? (2,000 / 2,500 / 3,000)","5. At the crossroads, they turn… (left / right / straight on)"]},{week:6,title:"La famille Bahati",scene:"A photo-slideshow video. A teenage girl presents her family photo by photo, standing in front of her house in Goma.",lines:[{speaker:"Neema",fr:"Bonjour ! Je m'appelle Neema et voici ma famille.",en:"Hello! My name is Neema and here is my family."},{speaker:"Neema",fr:"Nous sommes six : mon père, ma mère, deux frères, une sœur et moi.",en:"We are six: my father, my mother, two brothers, one sister and me."},{speaker:"Neema",fr:"Mon père s'appelle Justin. Il est grand et très travailleur. Il est mécanicien.",en:"My father's name is Justin. He is tall and very hard-working. He is a mechanic."},{speaker:"Neema",fr:"Ma mère s'appelle Furaha. Elle est petite, belle et très gentille. Elle est infirmière.",en:"My mother's name is Furaha. She is small, beautiful and very kind. She is a nurse."},{speaker:"Neema",fr:"Mon frère aîné, Patrick, a vingt-cinq ans. Il est marié et il a un fils.",en:"My older brother, Patrick, is twenty-five. He is married and has a son."},{speaker:"Neema",fr:"Mon petit frère, Moïse, a dix ans. Il est drôle et très intelligent.",en:"My little brother, Moïse, is ten. He is funny and very intelligent."},{speaker:"Neema",fr:"Ma sœur Sarah est étudiante à l'université. Elle est sérieuse et sportive.",en:"My sister Sarah is a university student. She is serious and sporty."},{speaker:"Neema",fr:"Le dimanche, toute la famille mange ensemble chez ma grand-mère.",en:"On Sundays, the whole family eats together at my grandmother's house."},{speaker:"Neema",fr:"J'aime beaucoup ma famille. Et vous, votre famille est grande ou petite ?",en:"I love my family very much. And you, is your family big or small?"}],questions:["1. How many people are in Neema's family? (5 / 6 / 7)","2. What is her father's job? (Driver / Mechanic / Teacher)","3. What does her mother do? (Nurse / Seller / Teacher)","4. How old is Moïse? (10 / 15 / 25)","5. Where does the family eat on Sundays? (At a restaurant / At church / At the grandmother's house)"]},{week:7,title:"Le voyage à Kinshasa",scene:"A travel vlog. A young woman shows photos on her phone and tells the story of her trip to Kinshasa last month. Photos of the airport, the Congo River, and the market.",lines:[{speaker:"Aline",fr:"Bonjour ! Le mois dernier, j'ai voyagé à Kinshasa pour la première fois.",en:"Hello! Last month, I travelled to Kinshasa for the first time."},{speaker:"Aline",fr:"D'abord, j'ai pris l'avion à l'aéroport de Goma, à sept heures du matin.",en:"First, I took the plane at Goma airport at seven in the morning."},{speaker:"Aline",fr:"Le vol a duré deux heures et demie. J'ai regardé les nuages — c'était magnifique !",en:"The flight lasted two and a half hours. I watched the clouds — it was magnificent!"},{speaker:"Aline",fr:"À Kinshasa, mon oncle m'a attendue à l'aéroport. Il est arrivé avec un taxi.",en:"In Kinshasa, my uncle waited for me at the airport. He arrived with a taxi."},{speaker:"Aline",fr:"Ensuite, nous avons visité le fleuve Congo. J'ai pris beaucoup de photos.",en:"Then, we visited the Congo River. I took lots of photos."},{speaker:"Aline",fr:"Le soir, toute la famille a mangé ensemble. J'ai goûté le pondu — très bon !",en:"In the evening, the whole family ate together. I tasted pondu — very good!"},{speaker:"Aline",fr:"Le lendemain, je suis allée au grand marché et j'ai acheté des tissus.",en:"The next day, I went to the big market and bought fabrics."},{speaker:"Aline",fr:"Enfin, dimanche, je suis rentrée à Goma, fatiguée mais très heureuse.",en:"Finally, on Sunday, I returned to Goma, tired but very happy."}],questions:["1. Why did Aline go to Kinshasa? (For work / For the first time / a visit / For school)","2. How did she travel? (By bus / By boat / By plane)","3. How long was the flight? (1 hour / 2.5 hours / 4 hours)","4. Who waited for her at the airport? (Her father / Her uncle / Her cousin)","5. What did she buy at the market? (Fabrics / Fruit / Shoes)"]},{week:8,title:"Les métiers de ma ville",scene:"A street-interview video. A journalist with a microphone asks people in a Bukavu street: « Qu'est-ce que vous faites dans la vie ? » Four people answer.",lines:[{speaker:"Journaliste",fr:"Bonjour ! Qu'est-ce que vous faites dans la vie ?",en:"Hello! What do you do for a living?"},{speaker:"Homme 1",fr:"Je suis chauffeur de taxi. Je travaille à Bukavu depuis dix ans.",en:"I am a taxi driver. I have worked in Bukavu for ten years."},{speaker:"Journaliste",fr:"Et vous, Madame ?",en:"And you, Madam?"},{speaker:"Femme 1",fr:"Je suis infirmière à l'hôpital général. J'aime beaucoup mon travail.",en:"I am a nurse at the general hospital. I really like my work."},{speaker:"Journaliste",fr:"Bonjour jeune homme, vous travaillez ?",en:"Hello young man, do you work?"},{speaker:"Homme 2",fr:"Pas encore — je suis étudiant. Je cherche du travail comme vendeur.",en:"Not yet — I am a student. I am looking for work as a seller."},{speaker:"Journaliste",fr:"Et vous, Mademoiselle ?",en:"And you, Miss?"},{speaker:"Femme 2",fr:"Je suis enseignante dans une école primaire. J'ai trente élèves.",en:"I am a teacher in a primary school. I have thirty pupils."},{speaker:"Journaliste",fr:"Merci à tous ! Voilà les métiers de notre ville.",en:"Thank you all! Those are the jobs of our town."}],questions:["1. How long has the taxi driver worked in Bukavu? (5 years / 10 years / 20 years)","2. Where does the nurse work? (At a school / At the general hospital / At a pharmacy)","3. What is the young man looking for? (Work as a seller / Work as a driver / A school)","4. How many pupils does the teacher have? (13 / 20 / 30)","5. Which job is NOT mentioned? (Nurse / Engineer / Teacher)"]},{week:9,title:"Les rêves de demain",scene:"A graduation-day video at a training centre. A reporter asks three young graduates about their plans for the future. Balloons and certificates in the background.",lines:[{speaker:"Journaliste",fr:"Félicitations ! Alors, quels sont vos projets ?",en:"Congratulations! So, what are your plans?"},{speaker:"Graduate 1",fr:"Merci ! L'année prochaine, je vais étudier la médecine à l'université.",en:"Thank you! Next year, I am going to study medicine at university."},{speaker:"Journaliste",fr:"Et vous, Mademoiselle ?",en:"And you, Miss?"},{speaker:"Graduate 2",fr:"Je vais d'abord travailler et économiser de l'argent. Ensuite, je vais ouvrir un restaurant.",en:"First I am going to work and save money. Then, I am going to open a restaurant."},{speaker:"Journaliste",fr:"Un restaurant ? Quel type de cuisine ?",en:"A restaurant? What type of cuisine?"},{speaker:"Graduate 2",fr:"La cuisine congolaise ! Pondu, saka-saka, poisson du lac...",en:"Congolese cuisine! Pondu, saka-saka, fish from the lake..."},{speaker:"Journaliste",fr:"Et vous, Monsieur ?",en:"And you, Sir?"},{speaker:"Graduate 3",fr:"Moi, je rêve de devenir professeur de français. Je veux enseigner dans mon village.",en:"Me, I dream of becoming a French teacher. I want to teach in my village."},{speaker:"Journaliste",fr:"De beaux projets ! Bonne chance à tous !",en:"Wonderful plans! Good luck to all!"}],questions:["1. What is the first graduate going to study? (Law / Medicine / Engineering)","2. What will the second graduate do FIRST? (Open a restaurant / Work and save money / Travel)","3. What cuisine will the restaurant serve? (Congolese / French / Italian)","4. What does the third graduate dream of becoming? (A doctor / A French teacher / A journalist)","5. Where does he want to teach? (In Kinshasa / In his village / In Belgium)"]},{week:10,title:"À la pharmacie",scene:"A mother with a sick child enters a pharmacy. The pharmacist asks questions and gives advice. Medicine boxes and a thermometer are visible.",lines:[{speaker:"Pharmacienne",fr:"Bonjour Madame. Je peux vous aider ?",en:"Hello Madam. Can I help you?"},{speaker:"Maman",fr:"Bonjour. Mon fils est malade. Il a de la fièvre depuis hier.",en:"Hello. My son is sick. He has had a fever since yesterday."},{speaker:"Pharmacienne",fr:"Je comprends. Quel âge a-t-il ?",en:"I understand. How old is he?"},{speaker:"Maman",fr:"Il a cinq ans. Il ne veut pas manger et il dort beaucoup.",en:"He is five years old. He doesn't want to eat and he sleeps a lot."},{speaker:"Pharmacienne",fr:"Il a mal quelque part ? À la tête, au ventre ?",en:"Does he hurt anywhere? Head, stomach?"},{speaker:"Maman",fr:"Il dit qu'il a mal à la tête.",en:"He says he has a headache."},{speaker:"Pharmacienne",fr:"Voici du paracétamol pour enfants. Il faut lui donner un sirop trois fois par jour.",en:"Here is children's paracetamol. You must give him one syrup three times a day."},{speaker:"Maman",fr:"Trois fois par jour, d'accord. Et si la fièvre continue ?",en:"Three times a day, OK. And if the fever continues?"},{speaker:"Pharmacienne",fr:"Si la fièvre continue après deux jours, il faut aller à l'hôpital.",en:"If the fever continues after two days, you must go to the hospital."},{speaker:"Maman",fr:"Merci beaucoup de votre aide, Madame !",en:"Thank you very much for your help, Madam!"}],questions:["1. Who is sick? (The mother / Her son / Her daughter)","2. Since when does he have a fever? (Since yesterday / For a week / Since this morning)","3. How old is the child? (3 / 5 / 7)","4. How many times a day must he take the syrup? (Once / Twice / Three times)","5. What must the mother do if the fever continues? (Buy more medicine / Go to the hospital / Wait a week)"]}];

let currentWeek=0,isPlayingAll=false,playQueue=[],currentUtterance=null,showQs=false;

function init(){renderTabs();renderWeek(0)}
function renderTabs(){document.getElementById('weekTabs').innerHTML=data.map((w,i)=>`<button class="week-tab ${i===0?'active':''}" onclick="switchWeek(${i})">Week ${w.week}</button>`).join('')}
function switchWeek(idx){currentWeek=idx;stopAll();document.querySelectorAll('.week-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));renderWeek(idx)}
function renderWeek(idx){const w=data[idx];document.getElementById('content').innerHTML=`<div class="scene-box"><strong>Week ${w.week} — ${w.title}</strong><br>${w.scene}</div><div id="dialogue">${w.lines.map((line,i)=>`<div class="dialogue-row"><div class="speaker">${line.speaker}</div><div class="bubble" onclick="speakLine(${idx},${i},this)" id="bubble-${i}"><div class="french">${line.fr}</div><div class="english">${line.en}</div><div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div></div>`).join('')}</div><div class="questions ${showQs?'':'hidden'}" id="qPanel"><h3>📝 Comprehension Questions</h3>${w.questions.map(q=>`<div class="q-item">${q}</div>`).join('')}</div>`}

function speakLine(weekIdx,lineIdx,el){stopAll();const utter=new SpeechSynthesisUtterance(data[weekIdx].lines[lineIdx].fr);utter.lang='fr-FR';utter.rate=parseFloat(document.getElementById('speed').value);utter.pitch=1;const voices=speechSynthesis.getVoices();const frVoice=voices.find(v=>v.lang.startsWith('fr'));if(frVoice)utter.voice=frVoice;utter.onstart=()=>el.classList.add('playing');utter.onend=()=>el.classList.remove('playing');utter.onerror=()=>el.classList.remove('playing');currentUtterance=utter;speechSynthesis.speak(utter)}

function playAll(){stopAll();isPlayingAll=true;playQueue=data[currentWeek].lines.map((_,i)=>i);playNextInQueue()}
function playNextInQueue(){if(!isPlayingAll||playQueue.length===0){isPlayingAll=false;return}const idx=playQueue.shift();const el=document.getElementById(`bubble-${idx}`);const utter=new SpeechSynthesisUtterance(data[currentWeek].lines[idx].fr);utter.lang='fr-FR';utter.rate=parseFloat(document.getElementById('speed').value);const voices=speechSynthesis.getVoices();const frVoice=voices.find(v=>v.lang.startsWith('fr'));if(frVoice)utter.voice=frVoice;utter.onstart=()=>el&&el.classList.add('playing');utter.onend=()=>{el&&el.classList.remove('playing');setTimeout(()=>playNextInQueue(),400)};utter.onerror=()=>{el&&el.classList.remove('playing');isPlayingAll=false};currentUtterance=utter;speechSynthesis.speak(utter)}

function stopAll(){isPlayingAll=false;playQueue=[];speechSynthesis.cancel();document.querySelectorAll('.bubble.playing').forEach(b=>b.classList.remove('playing'))}
function updateSpeed(){const t=document.getElementById('toast');t.textContent='Speed updated. Restart playback to apply.';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function toggleQuestions(){showQs=!showQs;const p=document.getElementById('qPanel');if(p)p.classList.toggle('hidden',!showQs)}

speechSynthesis.getVoices();
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
init();
</script>
</body>
</html>
